name: Backend Maven Build

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - Auth-Service
          - Parking-Service
          - Booking-Service
          - Billing-Service
          - Eurekaserver2
          - api-gateway1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build service
        working-directory: Backend/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
