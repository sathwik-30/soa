spring.application.name=api-gateway1
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=parking-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PARKING-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/parking/**

spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bookings/**

spring.cloud.gateway.server.webflux.routes[3].id=billing-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://BILLING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/billing/**

management.endpoints.web.exposure.include=health,info

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}